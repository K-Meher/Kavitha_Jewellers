<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jewellery | Kavitha Jewellers</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="site-header">

    <a href="index.html" class="back-link">
        ← Kavitha Jewellers
    </a>

</header>


<main class="product-page">

    <section class="product-detail">


        <!-- PRODUCT IMAGE -->

        <div class="product-photo-box">

            <img
                id="productImage"
                src=""
                alt="Jewellery"
                class="product-main-image"
            >

        </div>


        <!-- PRODUCT INFORMATION -->

        <div class="product-information">

            <p id="productPurity"
               class="gold-label">
            </p>


            <h1 id="productName">
            </h1>


            <p id="productDescription"
               class="description">
            </p>


            <!-- PRODUCT DETAILS -->

            <div class="information-box">

                <div>

                    <span>
                        Purity
                    </span>

                    <strong id="productPurityInfo">
                    </strong>

                </div>


                <div>

                    <span>
                        Weight
                    </span>

                    <strong id="productWeight">
                    </strong>

                </div>

            </div>


            <!-- GOLD RATE -->

            <div class="gold-price-box">

                <p>
                    Today's Gold Rate
                </p>

                <h2 id="goldRate">
                    Loading...
                </h2>

                <span>
                    Hyderabad • 22K / gram
                </span>

            </div>


            <button
                onclick="history.back()"
                class="back-button">

                ← Back to Collection

            </button>


        </div>

    </section>

</main>


<footer>

    © 2026 Kavitha Jewellers.
    All rights reserved.

</footer>


<script src="js/products.js"></script>

<script src="js/product.js"></script>

<script src="js/gold-rate.js"></script>


</body>

</html>
